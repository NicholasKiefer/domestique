plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.domestique.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.domestique.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1-alpha'
        // Pixels are ARM64. Override for an emulator: -PandroidAbi=x86_64
        ndk { abiFilters(project.findProperty('androidAbi') ?: 'arm64-v8a') }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            def retainedKey = rootProject.file('../.signing/domestique-test.keystore')
            if (retainedKey.exists()) {
                storeFile retainedKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/backend'))
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

chaquopy {
    defaultConfig {
        // scipy's Android wheel is currently available for Python 3.10.
        version = '3.10'
        if (project.hasProperty('buildPython')) buildPython(project.property('buildPython'))
        pip { install('-r', 'requirements.txt') }
    }
}

// Package the real backend and library, not a second implementation of the planner.
// Extracted to app-private storage at runtime because the app uses pathlib/glob.
def libraryCaches = tasks.register('prepareLibraryCaches', Exec) {
    workingDir '../..'
    commandLine(project.findProperty('buildPython') ?: 'python3.10', 'tools/build-library-caches.py')
    inputs.files(fileTree('../../src') { include '*.py', 'scripts/*.py', 'workouts/*.zwo' })
    outputs.files('../../src/workouts/.library_index.json', '../../src/workouts/.workout_facts.json')
}
def backendZip = tasks.register('bundleBackend', Zip) {
    dependsOn libraryCaches
    from('../../src') {
        into 'src'
        exclude '**/__pycache__/**', '**/*.pyc', '**/.env', '**/.oauth.env'
        exclude 'launcher.py', 'gpx_sources/**'
    }
    from('../..') { include 'VERSION', 'LICENSE', 'NOTICE' }
    archiveFileName = 'backend.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/backend')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('preBuild').configure { dependsOn backendZip }
