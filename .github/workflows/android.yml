name: Android APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'src/**', '.github/workflows/android.yml']
  push:
    branches: ['android/**']
    paths: ['android/**', 'src/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  pixel-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Pixel APK and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --no-daemon
      - name: Verify packaged backend
        run: |
          python -m pip install -r android/app/requirements.txt pytest
          python -m pytest -q android/tests
          python android/smoke_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: domestique-pixel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
