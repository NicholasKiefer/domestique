name: Android APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'src/**', '.github/workflows/android.yml']
  push:
    branches: ['android/**', 'mobile-app', 'sync/mobile-upstream']
    paths: ['android/**', 'src/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  pixel-apk:
    concurrency:
      group: android-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent development signer
        if: github.repository == 'NicholasKiefer/domestique' && github.ref == 'refs/heads/mobile-app' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::warning::ANDROID_KEYSTORE_BASE64 is not configured. Building a testing artifact only; automatic update publishing is disabled.'
          else
            mkdir -p .signing
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .signing/domestique-test.keystore
            chmod 600 .signing/domestique-test.keystore
          fi
      - name: Android build version
        run: |
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=0.1.3-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Build Pixel APK and lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest -PandroidVersionCode="$ANDROID_VERSION_CODE" -PandroidVersionName="$ANDROID_VERSION_NAME" --no-daemon
      - name: Verify packaged backend
        run: |
          python -m pip install -r android/app/requirements.txt pytest
          python -m pytest -q android/tests tests/test_android_foreground.py tests/test_android_icu_connection.py
          python android/smoke_backend.py
      - uses: actions/upload-artifact@v4
        with:
          name: domestique-pixel-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish Android update channel
        if: github.repository == 'NicholasKiefer/domestique' && github.ref == 'refs/heads/mobile-app' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .signing/domestique-test.keystore ]; then
            python android/publish_update.py
          else
            echo '::notice::One-time signing setup needed; see android/UPDATES.md.'
          fi
      - name: Remove private signing file
        if: always()
        run: rm -f .signing/domestique-test.keystore
